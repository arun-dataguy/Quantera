<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Blue rounded square background -->
  <rect width="200" height="200" rx="44" fill="#0050CB"/>

  <!-- Subtle inner glow gradient overlay -->
  <rect width="200" height="200" rx="44" fill="url(#shine)" opacity="0.15"/>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Q ring — bold geometric circle -->
  <circle cx="90" cy="98" r="46" stroke="white" stroke-width="16" fill="none"/>

  <!-- Q tail — diagonal going up-right, suggesting bullish trend -->
  <line x1="122" y1="128" x2="158" y2="93" stroke="white" stroke-width="16" stroke-linecap="round"/>

  <!-- Arrow tip on Q tail -->
  <polyline points="145,79 158,93 144,106" stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small rising pulse line inside the Q — the signal -->
  <polyline points="62,108 74,108 80,88 90,120 98,82 108,98 118,98" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65"/>
</svg>
