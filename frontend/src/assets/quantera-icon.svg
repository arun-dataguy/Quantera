<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Rounded square background -->
  <rect x="0" y="0" width="80" height="80" rx="20" fill="#0050CB"/>
  <!-- Q circle ring -->
  <circle cx="40" cy="40" r="24" fill="none" stroke="white" stroke-width="4.5"/>
  <!-- Pulse line cutting through Q -->
  <polyline
    points="16,40 24,40 28,50 33,22 40,54 46,32 51,40 64,40"
    fill="none" stroke="white" stroke-width="3.5"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
