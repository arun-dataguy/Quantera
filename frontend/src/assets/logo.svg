<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a6bff"/>
      <stop offset="100%" stop-color="#0050CB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- ── Icon block ── -->
  <rect x="0" y="4" width="64" height="64" rx="14" fill="url(#iconGrad)"/>
  <rect x="0" y="4" width="64" height="64" rx="14" fill="url(#shine)" opacity="0.12"/>

  <!-- Q ring -->
  <circle cx="29" cy="36" r="15" stroke="white" stroke-width="5" fill="none"/>

  <!-- Q tail upward-right -->
  <line x1="39.5" y1="47" x2="52" y2="32.5" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Arrow tip -->
  <polyline points="45,24.5 52,32.5 44,39" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Signal pulse inside Q -->
  <polyline points="19,39 23,39 25,31 29,43 33,28 37,35 40,35" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>

  <!-- ── Wordmark ── -->
  <!-- "Quantera" bold dark -->
  <text x="80" y="47"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="28"
    fill="#161b2b"
    letter-spacing="-1.2">Quantera</text>

  <!-- "AI" accent pill -->
  <rect x="289" y="22" width="36" height="20" rx="5" fill="#e8f0fe"/>
  <text x="297" y="36"
    font-family="Inter, system-ui, sans-serif"
    font-weight="700"
    font-size="11"
    fill="#0050CB"
    letter-spacing="0.5">AI</text>
</svg>
