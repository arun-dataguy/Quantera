<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72">
  <!-- Icon: blue rounded square -->
  <rect x="0" y="0" width="72" height="72" rx="16" fill="#0050CB"/>

  <!-- Q circle ring -->
  <circle cx="34" cy="33" r="18" fill="none" stroke="white" stroke-width="4"/>

  <!-- Q tail -->
  <line x1="40" y1="45" x2="51" y2="57" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Rising candlestick trend line -->
  <polyline
    points="19,43 25,39 29,41 35,33 41,28 48,22"
    fill="none" stroke="white" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: Quantera -->
  <text
    x="86" y="47"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-1"
    fill="#161b2b">Quantera</text>

  <!-- AI badge -->
  <rect x="272" y="14" width="26" height="18" rx="5" fill="#e8effe"/>
  <text
    x="285" y="27"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="10"
    font-weight="700"
    fill="#0050CB"
    text-anchor="middle">AI</text>
</svg>
