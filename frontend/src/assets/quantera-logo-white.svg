<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Icon: rounded square white/transparent on dark -->
  <rect x="0" y="4" width="72" height="72" rx="18" fill="white" fill-opacity="0.12"/>
  <!-- Q circle ring -->
  <circle cx="36" cy="40" r="22" fill="none" stroke="white" stroke-width="4"/>
  <!-- Pulse line -->
  <polyline
    points="14,40 22,40 26,49 31,24 36,52 41,34 46,40 58,40"
    fill="none" stroke="white" stroke-width="3.2"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Divider -->
  <line x1="88" y1="12" x2="88" y2="68" stroke="white" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Wordmark white -->
  <text
    x="100" y="51"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-1"
    fill="white">Quantera</text>

  <!-- AI badge -->
  <rect x="290" y="16" width="28" height="20" rx="6" fill="white" fill-opacity="0.15"/>
  <text
    x="304" y="30"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="11"
    font-weight="600"
    fill="white"
    text-anchor="middle">AI</text>
</svg>
